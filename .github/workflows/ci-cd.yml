name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  NODE_VERSION: '18.x'
  CI: true
  ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}

defaults:
  run:
    shell: bash
    working-directory: ./

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests with coverage
      run: |
        npm test -- --coverage --watchAll=false
        
    - name: Check for Codecov Token
      id: check-codecov-token
      if: github.event_name != 'pull_request'
      run: |
        if [ -n "${{ secrets.CODECOV_TOKEN }}" ]; then
          echo "HAS_CODECOV_TOKEN=true" >> $GITHUB_OUTPUT
        else
          echo "HAS_CODECOV_TOKEN=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Upload coverage to Codecov
      if: github.event_name != 'pull_request' && steps.check-codecov-token.outputs.HAS_CODECOV_TOKEN == 'true'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        file: ./coverage/lcov.info
        fail_ci_if_error: false
        verbose: true
    
    - name: Skip Codecov (No Token)
      if: github.event_name != 'pull_request' && steps.check-codecov-token.outputs.HAS_CODECOV_TOKEN == 'false'
      run: echo "Skipping Codecov upload - CODECOV_TOKEN not provided"

  build-and-deploy:
    name: Build and Deploy
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    
    - name: Install Vercel CLI
      run: npm install --global vercel@latest
      
    - name: Check Vercel Token
      id: check-vercel-token
      if: github.event_name != 'pull_request' && github.event_name != ''
      run: |
        if [ -n "${{ secrets.VERCEL_TOKEN }}" ]; then
          echo "HAS_VERCEL_TOKEN=true" >> $GITHUB_OUTPUT
        else
          echo "HAS_VERCEL_TOKEN=false" >> $GITHUB_OUTPUT
        fi
    
    - name: Pull Vercel Environment Information
      if: steps.check-vercel-token.outputs.HAS_VERCEL_TOKEN == 'true' && github.event_name != 'pull_request' && github.event_name != ''
      run: |
        vercel pull --yes --environment=${{ env.ENVIRONMENT }} --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Build Project Artifacts
      if: steps.check-vercel-token.outputs.HAS_VERCEL_TOKEN == 'true' && github.event_name != 'pull_request' && github.event_name != ''
      run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
  
    - name: Deploy to Vercel
      if: steps.check-vercel-token.outputs.HAS_VERCEL_TOKEN == 'true' && github.event_name != 'pull_request' && github.event_name != ''
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      run: |
        if [ "${{ env.ENVIRONMENT }}" = "production" ]; then
          echo "Deploying to production"
          vercel --prod --token=$VERCEL_TOKEN --confirm
        else
          echo "Deploying preview"
          vercel --token=$VERCEL_TOKEN --confirm
        fi
    
    - name: Skip Deployment (No Vercel Token)
      if: steps.check-vercel-token.outputs.HAS_VERCEL_TOKEN == 'false' && github.event_name != 'pull_request' && github.event_name != ''
      run: echo "Skipping Vercel deployment - VERCEL_TOKEN not provided"